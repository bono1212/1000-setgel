<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff7e6">
<title>1000 СЭТГЭЛ — Хандивлах</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800;900&family=Nunito:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body class="donate-page">
<div class="wrap narrow">
  <div class="stripe" aria-hidden="true"><i></i><i></i><i></i></div>
  <main class="phone solo" id="phone" aria-live="polite"></main>
  <p class="note" style="text-align:center;margin-top:16px">#1000Сэтгэл · #ДүүрэнДэмжлэг · #МанайБаг · #УрлагийнИхНаадам</p>
</div>

<script src="config.js"></script>
<script src="common.js"></script>
<script>
(function () {
  const C = window.APP_CONFIG;
  const phone = document.getElementById("phone");
  const KEY = "setgel_pending";
  const MAX_WAIT = 15 * 60 * 1000;
  let pollTimer = null, draft = { name: "", message: "" };

  const store = {
    get() { try { return JSON.parse(localStorage.getItem(KEY) || "null"); } catch { return null; } },
    set(v) { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch {} },
    clear() { try { localStorage.removeItem(KEY); } catch {} },
  };

  const head = `
    <img class="phone-logo" src="logo.png" alt="ШУТИС ДаТС">
    <div><div class="kicker">Урлагийн их наадам</div>
    <h2>ДҮҮРЭН ДЭМЖЛЭГ <em>1000 СЭТГЭЛ</em> ❤</h2></div>`;

  function viewForm(err) {
    stopPoll();
    phone.innerHTML = `${head}
      <p>Чиний илгээсэн 1,000₮ бол зүгээр нэг хандив биш.</p>
      <div class="lines"><span>❤ Багтаа өгч буй итгэл</span><span>👏 Найзууддаа илгээж буй алга ташилт</span><span>🏆 Сургуулийнхаа төлөө нэгдэж буй бахархал</span></div>
      <div class="equation">1 ОЮУТАН = 1,000₮ = 1 ДЭМЖЛЭГ</div>
      <form id="dForm" style="display:flex;flex-direction:column;gap:12px" novalidate>
        <div><label for="dName">Нэр (дэлгэц дээр "Оюу-Э**" гэж нууцлагдаж гарна)</label>
          <input type="text" id="dName" maxlength="40" autocomplete="name" placeholder="Жишээ: Э.Оюун"></div>
        <div><label for="dMsg">Багтаа хэлэх үг (заавал биш)</label>
          <input type="text" id="dMsg" maxlength="60" placeholder="Тайзыг эзэгнээрэй!"></div>
        <div class="amount"><span>Хандив</span><b>${U.fmt(C.AMOUNT)}₮</b></div>
        ${err ? `<div class="err">${U.esc(err)}</div>` : ""}
        <button class="btn primary lg" type="submit" id="payBtn">QPay-ээр төлөх</button>
      </form>
      <div class="bank-card">
        <b>Эсвэл дансаар шилжүүлэх</b>
        <div class="kv"><span>Данс</span><code>${U.esc(C.BANK_ACCOUNT)}</code></div>
        <div class="kv"><span>Хүлээн авагч</span><span>${U.esc(C.BANK_HOLDER)}</span></div>
        <div class="kv"><span>Гүйлгээний утга</span><span><code>${U.esc(C.BANK_NOTE)}</code></span></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn" type="button" id="cpAcct">Данс хуулах</button>
          <button class="btn" type="button" id="cpNote">Утга хуулах</button>
        </div>
        <span class="note">Дансаар орсон хандивыг админ шалгаад нэмэх тул дэлгэцэнд хэсэг хугацааны дараа гарна.</span>
      </div>`;
    document.getElementById("dName").value = draft.name;
    document.getElementById("dMsg").value = draft.message;
    document.getElementById("cpAcct").onclick = (e) => U.copy(C.BANK_ACCOUNT.replace(/\s/g, ""), e.target);
    document.getElementById("cpNote").onclick = (e) => U.copy(C.BANK_NOTE, e.target);
    document.getElementById("dForm").addEventListener("submit", onSubmit);
  }

  async function onSubmit(e) {
    e.preventDefault();
    draft.name = document.getElementById("dName").value.trim();
    draft.message = document.getElementById("dMsg").value.trim();
    const btn = document.getElementById("payBtn");
    btn.disabled = true; btn.textContent = "Нэхэмжлэх үүсгэж байна…";
    try {
      const res = await fetch("/api/create-invoice", {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(draft),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Алдаа гарлаа");
      const pending = { id: data.id, qr: data.qr_image, urls: data.urls || [], short: data.short_url, t: Date.now() };
      store.set(pending);
      viewInvoice(pending);
    } catch (err) {
      viewForm(err.message || "Сүлжээний алдаа. Дахин оролдоно уу.");
    }
  }

  function viewInvoice(p) {
    const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    const banks = p.urls.map((u) =>
      `<a href="${U.esc(u.link)}" rel="noopener"><img src="${U.esc(u.logo)}" alt="" loading="lazy"><span>${U.esc(u.description || u.name)}</span></a>`).join("");
    phone.innerHTML = `
      <div class="invoice">
        <div class="kicker">1,000₮ төлөх</div>
        ${isMobile ? `<p><b>Банкны апп-аа сонгоод төлнө үү.</b> Төлсний дараа энэ хуудас руу буцаж ирэхэд автоматаар баталгаажна.</p>` : `<p>Утасныхаа банкны апп-аар QR-ийг уншуулна уу.</p>`}
        ${isMobile && banks ? `<div class="bank-links">${banks}</div>` : ""}
        <div class="qrbox"><img src="data:image/png;base64,${p.qr}" alt="QPay QR код"></div>
        ${!isMobile && banks ? `<div class="bank-links">${banks}</div>` : ""}
        <div style="display:flex;align-items:center;gap:10px;color:var(--muted)"><div class="spinner" style="width:20px;height:20px;border-width:2px"></div><span id="waitTxt">Төлбөр хүлээж байна…</span></div>
        <button class="btn primary lg" id="checkBtn">Төлсөн, шалгах</button>
        <button class="btn" id="cancelBtn">Болих</button>
      </div>`;
    document.getElementById("checkBtn").onclick = () => check(p, true);
    document.getElementById("cancelBtn").onclick = () => { store.clear(); viewForm(); };
    startPoll(p);
  }

  async function check(p, manual) {
    if (Date.now() - p.t > MAX_WAIT) { store.clear(); return viewForm("Нэхэмжлэхийн хугацаа дууссан. Дахин үүсгэнэ үү."); }
    try {
      const r = await fetch("/api/check-payment?id=" + encodeURIComponent(p.id)).then((x) => x.json());
      if (r.status === "paid") { store.clear(); return viewSuccess(); }
      if (manual) { const w = document.getElementById("waitTxt"); if (w) w.textContent = "Төлбөр хараахан ороогүй байна. Хэдэн секунд хүлээгээд дахин шалгана уу."; }
    } catch {}
  }

  function startPoll(p) { stopPoll(); pollTimer = setInterval(() => check(p, false), 3000); }
  function stopPoll() { if (pollTimer) clearInterval(pollTimer); pollTimer = null; }

  // Банкны апп-аас буцаж ирэхэд шууд шалгана
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") { const p = store.get(); if (p) check(p, false); }
  });

  function viewSuccess() {
    stopPoll();
    phone.innerHTML = `
      <div class="success">
        <div class="heart">❤</div>
        <h2>Баярлалаа${draft.name ? ", " + U.esc(draft.name) : ""}!</h2>
        <p>Чиний зүрх LIVE дэлгэц дээр тодорлоо.</p>
        <p><b>🔥 ЧИ Ч БАС МАНАЙ БАГИЙН НЭГ ХЭСЭГ!</b></p>
        <button class="btn primary lg" id="again">Дахин дэмжих</button>
        <a class="btn lg" href="/" style="text-align:center;text-decoration:none">LIVE дэлгэц харах</a>
      </div>`;
    document.getElementById("again").onclick = () => viewForm();
  }

  // Эхлэл: хүлээгдэж буй төлбөр байвал үргэлжлүүлнэ
  const pending = store.get();
  if (pending && Date.now() - pending.t < MAX_WAIT) viewInvoice(pending); else { store.clear(); viewForm(); }
})();
</script>
</body>
</html>
